<main class="container">

  <section class="acoes">

    <div class="card">

      <h2>Criar uma nota fiscal</h2>

      <form>

        <div class="nota-fiscal">

          <h3>Nota fiscal</h3>

          <div>
            <p>**Código será gerado automaticamente pelo sistema</p>

            <label for="tipo-nota">
              Nota
            </label>

            <select id="tipo-nota" name="tipo-nota">
              <option value="aberto">Aberto</option>
              <option value="fechado">Fechado</option>
            </select>
          </div>

          <div class="produto-quantidade">

            <select id="produto" name="produto" class="produto">
              <option value="">Selecione o produto</option>
            </select>

            <select id="quantidade" name="quantidade" class="quantidade">
              <option value="">Qtd</option>
            </select>

          </div>

        </div>

        @for (notaFiscal of notaFiscal; track $index) {

        <div class="nota-fiscal">

          <h3>Nota fiscal {{ $index + 2 }}</h3>

          <div>
            <p>**Código será gerado automaticamente pelo sistema</p>

            <label [for]="'tipo-nota' + ($index + 2)">
              Nota
            </label>

            <select [id]="'tipo-nota' + ($index + 2)"
                    [name]="'tipo-nota' + ($index + 2)">

              <option value="aberto">Aberto</option>
              <option value="fechado">Fechado</option>

            </select>
          </div>

          <div class="produto-quantidade">

            <select [id]="'produto' + ($index + 2)"
                    [name]="'produto' + ($index + 2)"
                    class="produto">

              <option value="">Selecione o produto</option>

            </select>

            <select [id]="'quantidade' + ($index + 2)"
                    [name]="'quantidade' + ($index + 2)"
                    class="quantidade">
                    

              <option value="">Qtd</option>

            </select>

          </div>

          <button type="button"
                  class="removerB"
                  (click)="removerProduto($index)">

            Remover nota

          </button>

        </div>

        }

        <button type="button"
                class="adicionarB"
                (click)="adicionarProduto()">
          + Adicionar outra nota
        </button>

        <button type="submit"
                class="cadastroB">
          Imprimir notas
        </button>

      </form>

    </div>

  </section>

  <button type="button"
          class="cadastroB">
    Verificar todas as notas fiscais
  </button>

</main>
